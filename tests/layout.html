<!doctype html>
<html lang="en-GB">
  <head>
    <base href="../" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A teacher-led adventure into the world of mammals."
    />
    <title>Mammal Discovery Club</title>
    <link rel="icon" href="assets/topics/mammals/generated/club-badge-rabbit.webp" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <link rel="stylesheet" href="src/styles/skins.css" />
    <link rel="stylesheet" href="src/styles/homeward-trail.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to the game</a>
    <div class="background" aria-hidden="true"></div>
    <header class="topbar">
      <button id="home" class="brand" hidden aria-label="Home">
        <img id="brand-image" alt="" /><span id="brand-name"></span>
      </button>
      <div class="utilities">
        <button id="mute" aria-pressed="false" title="Mute (M)">
          Sound on
        </button>
        <button id="fullscreen" aria-pressed="false" title="Fullscreen (F)">
          Full screen
        </button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <div
      id="announcer"
      class="sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="effects" aria-hidden="true"></div>
    <script type="module" src="tests/layout.browser.js"></script>
  </body>
</html>
